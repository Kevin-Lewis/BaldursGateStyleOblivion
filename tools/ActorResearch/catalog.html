<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Oblivion Actor Catalog</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#171a1f;color:#e4e6eb}body{margin:30px auto;max-width:1500px;padding:0 20px}h1{margin-bottom:8px}p{color:#aeb7c4}input,select{padding:10px;background:#252b33;color:inherit;border:1px solid #4b5563;border-radius:5px}input{min-width:270px}.tier-edit,.group-tier{min-width:0;width:65px}button{padding:9px;background:#415c80;color:white;border:0;border-radius:5px;cursor:pointer}.handling-edit{display:block;max-width:170px;margin:7px 0}.group-enabled{min-width:0}#message{margin:12px 0;color:#ffd68e}#group-editor{margin:15px 0}nav{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}table{width:100%;border-collapse:collapse}th{text-align:left;color:#aeb7c4}td,th{padding:12px 9px;border-bottom:1px solid #343b45;vertical-align:top}small{display:block;color:#aeb7c4;margin-top:5px}a{color:#b4cfff}details{margin-top:8px}pre{white-space:pre-wrap;font-size:12px}code{word-break:break-all}.notes{max-width:490px}.tag{color:#ffd68e}#count{margin:12px 0}.group{background:#252b33;font-weight:600}label{display:flex;gap:6px;align-items:center}
</style>
<h1>Oblivion Actor Catalog</h1><p>Edit individual tiers or group rules and save directly to the configuration. Blank individual values use group rules.</p><p>Editable configuration: <code id="config"></code></p>
<nav><input id="search" placeholder="Search name, ID, notes, or rule" aria-label="Search"><select id="group" aria-label="Group"><option value="">All groups</option></select><select id="plugin" aria-label="Plugin"><option value="">All plugins</option></select><select id="sort" aria-label="Sort"><option value="group">Group / Name</option><option value="name">Name</option><option value="tier">Tier, highest first</option></select><label><input id="review" type="checkbox" style="min-width:0">Quest / script references</label></nav><div id="count"></div>
<div id="message" role="status"></div><details id="group-editor"><summary>Edit group rules</summary><div id="group-rules"></div></details>
<table><thead><tr><th>Actor</th><th>Tier / Handling</th><th>Original scaling</th><th>Notes / Evidence</th></tr></thead><tbody id="rows"></tbody></table>
<script>
const actors=/*ACTORS*/[];const groups=/*GROUPS*/[];const token=/*TOKEN*/"";const config=/*CONFIG*/"";
const $=id=>document.getElementById(id);$('config').textContent=config;
const escape=text=>String(text??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
for(const [id,key] of [['group','Group'],['plugin','SourcePlugin']]) for(const value of [...new Set(actors.map(a=>a[key]))].sort()){let option=document.createElement('option');option.value=value;option.textContent=value;$(id).append(option)}
function render(){let query=$('search').value.toLowerCase();let rows=actors.filter(a=>(!$('group').value||a.Group===$('group').value)&&(!$('plugin').value||a.SourcePlugin===$('plugin').value)&&(!$('review').checked||a.ReviewSignals.length)&&(!query||JSON.stringify(a).toLowerCase().includes(query)));let sort=$('sort').value;const name=a=>(a.Name||a.EditorID||a.FormKey);rows.sort((a,b)=>(sort==='tier'?((b.Tier??-1)-(a.Tier??-1)):sort==='group'?a.Group.localeCompare(b.Group):0)||name(a).localeCompare(name(b))||a.FormKey.localeCompare(b.FormKey));$('count').textContent=`${rows.length} of ${actors.length} actors`;let group='';$('rows').innerHTML=rows.map(a=>{let heading='';if(sort==='group'&&group!==a.Group){group=a.Group;heading=`<tr class="group"><td colspan="4">${escape(group)}</td></tr>`}let original=a.Original;let links=a.Sources.map(url=>{try{let u=new URL(url);if(u.protocol==='https:'&&(u.hostname==='uesp.net'||u.hostname.endsWith('.uesp.net')))return `<a href="${escape(url)}" target="_blank" rel="noopener noreferrer">UESP</a>`}catch{}return ''}).join(' · ');return heading+`<tr><td><strong>${escape(name(a))}</strong><small>${escape(a.EditorID)}</small><small><code>${escape(a.FormKey)}</code></small><small>Winner: ${escape(a.WinningOverridePlugin)}</small></td><td>${actorControls(a)}</td><td>${original.PCLevelOffset?'Player offset':'Fixed'}: ${original.Level??'unknown'}<small>Min: ${original.MinimumLevel??'?'} · Max: ${original.MaximumLevel??'?'}</small></td><td class="notes">${escape(a.Description)}<small>${escape(a.Reason)}</small>${a.Uncertainty?`<small class="tag">Uncertainty: ${escape(a.Uncertainty)}</small>`:''}<small>${links}</small><small>Rule: ${escape(a.Rule||'None')}</small><small>Edit: <code>${escape(a.EditFile)}</code></small>${a.ReviewSignals.length?`<details><summary>Quest / script review signals (${a.ReviewSignals.length})</summary>${escape(a.ReviewSignals.join(', '))}</details>`:''}<details><summary>Assignment decisions</summary><pre>${escape(JSON.stringify(a.Dimensions,null,2))}</pre></details></td></tr>`}).join('')}
const handling=['Generic','Named','QuestRelated','FactionLeader','MinorBoss','MajorBoss','ProtectedSpecial'];
function actorControls(a){if(!token)return `${a.Tier??'Unassigned'}<small>${escape(a.Handling)}</small>`;return `<input class="tier-edit" data-key="${escape(a.FormKey)}" type="number" min="0" max="10" step="1" value="${a.OverrideTier??''}" placeholder="Group" aria-label="Tier for ${escape(a.Name)}"><select class="handling-edit" data-key="${escape(a.FormKey)}" aria-label="Handling"><option value="">Use group rule</option>${handling.map(h=>`<option ${a.OverrideHandling===h?'selected':''}>${h}</option>`).join('')}</select><button class="save-actor" data-key="${escape(a.FormKey)}">Save</button><small>Effective tier: ${a.Tier??'Unassigned'}</small><small>${escape(a.Handling)}</small>`}
async function post(path,body){$('message').textContent='Saving�';let response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Actor-Editor-Token':token},body:JSON.stringify(body)});let result=await response.json();if(!response.ok)throw new Error(result.error||'Save failed');$('message').textContent='Saved to configuration.';return result}
function tier(input){if(input.value==='')return null;let n=Number(input.value);if(!Number.isInteger(n)||n<0||n>10)throw new Error('Tier must be a whole number from 0 to 10.');return n}
$('rows').addEventListener('click',async event=>{if(!event.target.classList.contains('save-actor'))return;let key=event.target.dataset.key;let row=event.target.closest('tr');try{let updated=await post('/api/actor',{formKey:key,tier:tier(row.querySelector('.tier-edit')),handling:row.querySelector('.handling-edit').value||null});Object.assign(actors.find(a=>a.FormKey===key),updated);render()}catch(error){$('message').textContent=error.message}});
if(token){$('group-rules').innerHTML=groups.map((g,i)=>`<p><strong>${escape(g.Group)} / ${escape(g.Id)}</strong><small>${escape(g.Match)}</small><input class="group-tier" data-index="${i}" type="number" min="0" max="10" step="1" value="${g.Tier??''}" placeholder="Unassigned" aria-label="Group tier"><label><input class="group-enabled" data-index="${i}" type="checkbox" ${g.Enabled?'checked':''}>Enabled</label><button class="save-group" data-index="${i}">Save group rule</button></p>`).join('');$('group-rules').addEventListener('click',async event=>{if(!event.target.classList.contains('save-group'))return;let index=Number(event.target.dataset.index);let g=groups[index];let row=event.target.closest('p');try{let result=await post('/api/group',{group:g.Group,id:g.Id,tier:tier(row.querySelector('.group-tier')),enabled:row.querySelector('.group-enabled').checked});actors.splice(0,actors.length,...result);render()}catch(error){$('message').textContent=error.message}})}else{$('group-editor').hidden=true;$('message').textContent='Read-only catalog. Double-click Edit Actor Tiers.cmd to open the editor.'}
for(const id of ['search','group','plugin','sort','review']) $(id).addEventListener('input',render);render();
</script></html>
