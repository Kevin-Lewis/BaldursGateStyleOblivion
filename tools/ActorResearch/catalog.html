<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Actor Tier Editor</title>
<style>
:root{color-scheme:dark;font:14px system-ui;background:#171a1f;color:#e4e6eb}body{margin:20px auto;max-width:1700px;padding:0 16px}h1{margin:0 0 6px}p{color:#aeb7c4;margin:8px 0}input,select{padding:6px;background:#252b33;color:inherit;border:1px solid #4b5563;border-radius:4px}#search{min-width:260px}.tier-edit,.group-tier{width:52px}.fixed-level-edit{width:65px}button{padding:6px 10px;background:#415c80;color:white;border:0;border-radius:4px;cursor:pointer}.handling-edit{max-width:190px}#message{color:#ffd68e}nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0 8px}table{width:100%;border-collapse:collapse}th{text-align:left;color:#aeb7c4;background:#171a1f;position:sticky;top:0;z-index:1}td,th{padding:7px 9px;border-bottom:1px solid #343b45;vertical-align:top}small{display:block;color:#aeb7c4;margin-top:3px}a,summary{color:#b4cfff}details{margin-top:4px}summary{cursor:pointer}pre{white-space:pre-wrap;font-size:12px}code{overflow-wrap:anywhere}.notes{width:42%}.preview{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:#aeb7c4;font-size:13px}.tag{color:#ffd68e}#count{margin:8px 0}.group{background:#252b33;font-weight:600}label{display:flex;gap:6px;align-items:center}.tier-controls{display:flex;align-items:center;gap:6px;white-space:nowrap}.tier-value{font-weight:700;min-width:26px;color:#ffd68e}.sort-heading{padding:0;background:none;color:inherit;font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:3px}.special-handling{margin:8px 0}.group-rule{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #343b45}.group-rule strong{min-width:320px}#group-editor{margin:12px 0}.pager{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.page-info{color:#aeb7c4}.delete-actor{background:#663c42}button:disabled{opacity:.4;cursor:default}
</style>
<h1>Actor Tier Editor</h1><a id="list-editor" href="/lists" hidden>Creature list editor</a> · <a id="geographic-editor" href="/geography" hidden>Geographic review</a><p>Enter a tier from 0 to 10 and click Save to edit one actor record. Leave the box blank to use its automatic tier.</p><details><summary>Configuration file</summary><code id="config"></code></details>
<nav><input id="search" placeholder="Search name, ID, notes, or rule" aria-label="Search"><select id="group" aria-label="Group"><option value="">All groups</option></select><select id="plugin" aria-label="Plugin"><option value="">All plugins</option></select><select id="overrides" aria-label="Overrides"><option value="">All actors</option><option value="only">Overrides only</option><option value="none">No overrides</option></select><label>Sort by <select id="sort" aria-label="Sort"><option value="group">Group / Name</option><option value="name">Name</option><option value="tier">Tier: highest first</option><option value="tier-asc">Tier: lowest first</option></select></label><label><input id="review" type="checkbox">Quest / script references</label></nav><div id="count"></div>
<div id="message" role="status"></div><details id="group-editor"><summary>Edit group rules (changes all matching actors)</summary><div id="group-rules"></div></details>
<div class="pager"><button id="previous">Previous</button><label>Page <select id="page" aria-label="Page"></select></label><button id="next">Next</button><label>Rows <select id="page-size" aria-label="Rows per page"><option>25</option><option selected>50</option><option>100</option></select></label><span id="page-info" class="page-info"></span></div>
<table><thead><tr><th>Actor</th><th><button id="tier-sort" class="sort-heading" title="Click to reverse tier order">Tier</button></th><th>Level override</th><th>Original scaling</th><th>Notes / Evidence</th></tr></thead><tbody id="rows"></tbody></table>
<div class="pager"><button id="previous-bottom">Previous</button><span id="page-info-bottom" class="page-info"></span><button id="next-bottom">Next</button></div>
<script>
const actors=/*ACTORS*/[];const groups=/*GROUPS*/[];const token=/*TOKEN*/"";const config=/*CONFIG*/"";
const $=id=>document.getElementById(id);$('config').textContent=config;
const escape=text=>String(text??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const actorName=a=>a.Name||a.EditorID||a.FormKey;
let page=0;const searchCache=new WeakMap();
function searchText(a){if(!searchCache.has(a))searchCache.set(a,[a.Name,a.EditorID,a.FormKey,a.SourcePlugin,a.WinningOverridePlugin,a.Group,a.Handling,a.Description,a.Reason,a.Uncertainty,a.Rule,a.Model].join(' ').toLowerCase());return searchCache.get(a)}
for(const [id,key] of [['group','Group'],['plugin','SourcePlugin']])for(const value of [...new Set(actors.map(a=>a[key]))].sort()){let option=document.createElement('option');option.value=value;option.textContent=value;$(id).append(option)}
function compare(a,b,sort){let order=0;if(sort==='tier'||sort==='tier-asc')order=a.Tier==null?(b.Tier==null?0:1):b.Tier==null?-1:(sort==='tier'?b.Tier-a.Tier:a.Tier-b.Tier);else if(sort==='group')order=a.Group.localeCompare(b.Group);return order||actorName(a).localeCompare(actorName(b))||a.FormKey.localeCompare(b.FormKey)}
const handling=['Generic','Named','QuestRelated','FactionLeader','MinorBoss','MajorBoss','ProtectedSpecial'];
function actorControls(a){if(!token)return `<span class="tier-value">${a.Tier??'Unassigned'}</span>`;return `<div class="tier-controls"><span class="tier-value" title="Current assigned tier">${a.Tier??'?'}</span><input class="tier-edit" data-key="${escape(a.FormKey)}" type="number" min="0" max="10" step="1" value="${a.OverrideTier??''}" placeholder="Tier" title="Blank uses the automatic tier" aria-label="Tier for ${escape(actorName(a))}"><button class="save-actor" data-key="${escape(a.FormKey)}">Save</button>${a.HasOverride?`<button class="delete-actor" data-key="${escape(a.FormKey)}" title="Remove this actor's entire individual entry, including notes, and return to automatic rules">Delete override</button>`:''}</div><small>${a.OverrideTier!=null?'Individual override':a.Tier!=null?'Automatic assignment':'Unassigned'}</small>`}
function levelControl(a){return token?`<input class="fixed-level-edit" type="number" min="1" max="32767" step="1" value="${a.FixedLevel??''}" placeholder="Auto" title="Exact actor level; blank uses tier mapping" aria-label="Fixed level override for ${escape(actorName(a))}"><small>Mapped: ${a.MappedLevel??'unassigned'}</small>`:`${a.FixedLevel??'Automatic'}<small>Mapped: ${a.MappedLevel??'unassigned'}</small>`}
function handlingControl(a){if(!token)return '';return `<label class="special-handling">Special handling <select class="handling-edit" data-key="${escape(a.FormKey)}" aria-label="Special handling"><option value="">Automatic</option>${handling.map(h=>`<option ${a.OverrideHandling===h?'selected':''}>${h}</option>`).join('')}</select></label><label class="special-handling">Deleveling <select class="delevel-edit" aria-label="Deleveling exemption"><option value="">Automatic policy</option><option value="true" ${a.Delevel===true?'selected':''}>Explicitly include</option><option value="false" ${a.Delevel===false?'selected':''}>Exempt this actor</option></select></label><small>Level mapping: ${a.MappedLevel??'no level assigned'}. A fixed level overrides the tier mapping. Explicit inclusion bypasses helper and handling safeguards; player and script-risk protections remain.</small>`}
$('list-editor').hidden=!token;
$('geographic-editor').hidden=!token;
function render(){
 let query=$('search').value.toLowerCase();let rows=actors.filter(a=>(!$('overrides').value||($('overrides').value==='only'?a.HasOverride:!a.HasOverride))&&(!$('group').value||a.Group===$('group').value)&&(!$('plugin').value||a.SourcePlugin===$('plugin').value)&&(!$('review').checked||a.ReviewSignals.length)&&(!query||searchText(a).includes(query)));let sort=$('sort').value;rows.sort((a,b)=>compare(a,b,sort));$('count').textContent=`${rows.length} of ${actors.length} actors`;$('tier-sort').textContent=sort==='tier'?'Tier (high to low)':sort==='tier-asc'?'Tier (low to high)':'Tier';const size=Number($('page-size').value)||50;const pages=Math.max(1,Math.ceil(rows.length/size));page=Math.min(Math.max(0,page),pages-1);
 $('page').innerHTML=Array.from({length:pages},(_,i)=>`<option value="${i}" ${i===page?'selected':''}>${i+1} of ${pages}</option>`).join('');$('page').value=String(page);$('page').disabled=!rows.length;
 const start=page*size;const info=rows.length?`${start+1}-${Math.min(start+size,rows.length)} of ${rows.length} matching actors`:'No matching actors';
 for(const id of ['page-info','page-info-bottom'])$(id).textContent=info;
 for(const id of ['previous','previous-bottom'])$(id).disabled=page===0;
 for(const id of ['next','next-bottom'])$(id).disabled=page===pages-1;
 let group='';
 $('rows').innerHTML=rows.slice(start,start+size).map(a=>{let heading='';if(sort==='group'&&group!==a.Group){group=a.Group;heading=`<tr class="group"><td colspan="5">${escape(group)}</td></tr>`}let original=a.Original;let links=a.Sources.map(url=>{try{let u=new URL(url);if(u.protocol==='https:'&&(u.hostname==='uesp.net'||u.hostname.endsWith('.uesp.net')))return `<a href="${escape(url)}" target="_blank" rel="noopener noreferrer">UESP</a>`}catch{}return ''}).join(' · ');
 return heading+`<tr><td><strong>${escape(actorName(a))}</strong><small>${escape(a.EditorID)}</small></td><td>${actorControls(a)}</td><td>${levelControl(a)}</td><td>${original.PCLevelOffset?'Player offset':'Fixed level'}: ${original.Level??'unknown'}${original.PCLevelOffset?`<small>Min: ${original.MinimumLevel??'?'} · Max: ${original.MaximumLevel??'?'}</small>`:''}</td><td class="notes"><div class="preview">${escape(a.Description||a.Reason||'No tier assignment yet.')}</div><details><summary>Details</summary><small><code>${escape(a.FormKey)}</code> · Winner: ${escape(a.WinningOverridePlugin)}</small><small>Edit: <code>${escape(a.EditFile)}</code></small>${a.Description?`<p>${escape(a.Description)}</p>`:''}<p>${escape(a.Reason)}</p>${a.Uncertainty?`<p class="tag">Uncertainty: ${escape(a.Uncertainty)}</p>`:''}${links}<small>Rule: ${escape(a.Rule||'None')}</small>${a.Model?`<small>Research model: ${escape(a.Model)}</small>`:''}${handlingControl(a)}${a.DelevelingReview?`<p>Deleveling review: ${escape(a.DelevelingReview)}</p>`:''}${a.ReviewSignals.length?`<details><summary>Quest / script references (${a.ReviewSignals.length})</summary>${escape(a.ReviewSignals.join(', '))}</details>`:''}<details><summary>Technical assignment details</summary><pre>${escape(JSON.stringify(a.Dimensions,null,2))}</pre></details></details></td></tr>`}).join('')
}
async function post(path,body){$('message').textContent='Saving...';let response=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Actor-Editor-Token':token},body:JSON.stringify(body)});let result=await response.json().catch(()=>null);if(!response.ok)throw new Error(result?.error||(response.status===403?'Editor session expired. Refresh the page and try again.':'Save failed; the server could not complete the request.'));if(!result)throw new Error('The server returned an empty response. Refresh the page and try again.');$('message').textContent='Saved to configuration.';return result}
function fixedLevel(input){if(input.value==='')return null;let n=Number(input.value);if(!Number.isInteger(n)||n<1||n>32767)throw new Error('Fixed level must be a whole number from 1 to 32767.');return n}
function tier(input){if(input.value==='')return null;let n=Number(input.value);if(!Number.isInteger(n)||n<0||n>10)throw new Error('Tier must be a whole number from 0 to 10.');return n}
$('rows').addEventListener('click',async event=>{let deleting=event.target.classList.contains('delete-actor');if(!deleting&&!event.target.classList.contains('save-actor'))return;let key=event.target.dataset.key;let row=event.target.closest('tr');let button=event.target;button.disabled=true;try{let updated=await (deleting?post('/api/actor/delete',{formKey:key}):post('/api/actor',{formKey:key,tier:tier(row.querySelector('.tier-edit')),handling:row.querySelector('.handling-edit').value||null,fixedLevel:fixedLevel(row.querySelector('.fixed-level-edit')),delevel:row.querySelector('.delevel-edit').value===''?null:row.querySelector('.delevel-edit').value==='true'}));$('message').textContent=deleting?`Override deleted for ${actorName(updated)}. Automatic tier: ${updated.Tier??'unassigned'}.`:`Saved ${actorName(updated)}: ${updated.OverrideTier==null?'automatic tier':`tier ${updated.OverrideTier}`}.`;let actor=actors.find(a=>a.FormKey===key);Object.assign(actor,updated);searchCache.delete(actor);render()}catch(error){$('message').textContent=error.message}finally{button.disabled=false}});
if(token){$('group-rules').innerHTML=groups.map((g,i)=>`<p class="group-rule"><strong>${escape(g.Group)} / ${escape(g.Id)}</strong><small>${escape(g.Match)}</small><input class="group-tier" data-index="${i}" type="number" min="0" max="10" step="1" value="${g.Tier??''}" placeholder="Tier" aria-label="Group tier"><label><input class="group-enabled" data-index="${i}" type="checkbox" ${g.Enabled?'checked':''}>Enabled</label><button class="save-group" data-index="${i}">Save group rule</button></p>`).join('');$('group-rules').addEventListener('click',async event=>{if(!event.target.classList.contains('save-group'))return;let index=Number(event.target.dataset.index);let g=groups[index];let row=event.target.closest('p');try{let result=await post('/api/group',{group:g.Group,id:g.Id,tier:tier(row.querySelector('.group-tier')),enabled:row.querySelector('.group-enabled').checked});actors.splice(0,actors.length,...result);render()}catch(error){$('message').textContent=error.message}})}else{$('group-editor').hidden=true;$('message').textContent='Read-only catalog. Double-click Edit Actor Tiers.cmd to open the editor.'}
$('tier-sort').addEventListener('click',()=>{$('sort').value=$('sort').value==='tier'?'tier-asc':'tier';page=0;render()});
let searchTimer;
$('search').addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{page=0;render()},150)});
for(const id of ['group','plugin','overrides','sort','review','page-size'])$(id).addEventListener('input',()=>{page=0;render()});
$('page').addEventListener('input',()=>{page=Number($('page').value);render()});
for(const id of ['previous','previous-bottom'])$(id).addEventListener('click',()=>{page--;render()});
for(const id of ['next','next-bottom'])$(id).addEventListener('click',()=>{page++;render()});
render();
</script></html>
